name: Continuous Integration

# Per push/PR: exactly three full CMake builds + tests (macOS/MacPorts, Linux, Windows/MSYS2 UCRT64), C++17.
# Extra variants (debug builds with C++20, built with the Makefiles, which Natron's build-plugins.sh still uses)
# only run nightly (if master changed) or on demand.
#
# Frugal CI (NatronGitHub runners are shared by all repos): one run per change. The macOS job (scarce runners)
# only runs after the Linux and Windows jobs passed; merging requires only Linux and Windows. Pushes run CI only on
# master, RB-* and tags; feature branches run through their pull request. Draft pull requests don't run
# CI. Superseded runs are cancelled, except for tags. Artifacts only for tags and manual runs.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * *' # nightly, 03:17 UTC: extra variants (skipped if master didn't change)
  push:
    branches: [master, 'RB-*']
    tags: ['*']
    paths-ignore:
      - LICENSE
      - README.md
      - 'Documentation/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - LICENSE
      - README.md
      - 'Documentation/**'

permissions:
  contents: read

concurrency:
  # nightly and manual runs have their own groups, so that they don't cancel (or get cancelled by) master's push CI.
  # Runs of draft pull requests (which skip every job) have their own group too: otherwise a late run of a push made
  # while the PR was a draft cancels the ready_for_review run, then skips itself, and no CI runs at all.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event_name || 'ci' }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Debug builds (C++20, with the Makefiles) are an extra variant: only on schedule or on demand.
  EXTRA_VARIANTS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  # Bundles (testing bundles used by Natron's CI) are only uploaded for tags and manual runs.
  UPLOAD_BUNDLES: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Skip the nightly run if master didn't change since the last completed nightly run (this job only runs on
  # schedule): once per commit, even if that run failed. Compare commits rather than dates: commit dates may be
  # older than the push. If the API call fails, run anyway.
  changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule --status completed --limit 1 --json headSha --jq '.[0].headSha // empty') || last=
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "master ($GITHUB_SHA) didn't change since the last nightly run: skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux (Ubuntu 24.04)
    needs: changes
    # no CI for draft pull requests; the scheduled run only if master changed
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.run == 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Install Ubuntu system packages
        run: |
          sudo apt-get update
          # fonts-freefont-ttf: FreeMono, one of the default fonts of OpenImageIO (DroidSans, cour, Courier New, FreeMono),
          # for OIIOText (io-hostdemo)
          sudo apt-get install -y cmake bison flex libopencolorio-dev libopenimageio-dev openimageio-tools libfmt-dev libopenexr-dev libimath-dev \
            libgl-dev libegl-dev liblcms2-dev libraw-dev libwebp-dev libtiff-dev libopenjp2-7-dev libpng-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev ffmpeg patchelf libexpat1-dev fonts-freefont-ttf
      - name: Cache SeExpr
        id: cache-seexpr
        uses: actions/cache@v4
        with:
          path: SeExprBuild
          key: seexpr-2.11-ubuntu-24.04-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Build SeExpr 2.11
        if: steps.cache-seexpr.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 -b v2.11 https://github.com/wdas/SeExpr.git SeExprSrc
          cd SeExprSrc
          sed -i -e "/SeExprEditor/d" -e "/demos/d" -e "/tests/d" -e "/doc/d" CMakeLists.txt
          cmake . -B build -DCMAKE_INSTALL_PREFIX=$PWD/../SeExprBuild -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_CXX_STANDARD=11 -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          make -j4 -C build
          make install -C build
      - name: Build (release, CMake)
        run: |
          # IO_HOSTDEMO_TESTS: ctest renders every plug-in of the installed bundle with openfx's hostDemo (io-hostdemo)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOFX_IO_REQUIRE_ALL=ON -DSEEXPR_HOME=$PWD/SeExprBuild -DCMAKE_INSTALL_PREFIX=$PWD -DPLUGIN_INSTALLDIR=Bundle \
            -DIO_HOSTDEMO_TESTS=ON
          cmake --build build -j4
          # installs Bundle/IO.ofx.bundle
          cmake --install build
      - name: Check the installed bundle (linuxCheckBundle.sh)
        # openfx's linuxCheckBundle.sh (OFX_LINUX_CHECK_BUNDLE): no bundled system library, no GLIBC_PRIVATE, GLIBC_ABI_*,
        # DT_RELR or unnumbered version need, only $ORIGIN rpaths (or OFX_ABI_RPATH_ALLOW's). This build uses
        # Ubuntu 24.04's libraries (glibc 2.39, GCC 13): --no-needed (they come from the system, nothing is bundled)
        # and no symbol version limit (99). A Rocky Linux 9 build would use the defaults (EL9's limits).
        # Exit status 1 (problems) or 2 (usage error, missing tool) fails the job.
        env:
          OFX_ABI_GLIBC: 99
          OFX_ABI_GLIBCXX: 99
          OFX_ABI_CXXABI: 99
          OFX_ABI_GCC: 99
          OFX_ABI_GOMP: 99
          OFX_ABI_LIBATOMIC: 99
          OFX_ABI_ZLIB: 99
        run: |
          check=$(sed -n 's/^OFX_LINUX_CHECK_BUNDLE:FILEPATH=//p' build/CMakeCache.txt)
          test -n "$check" || { echo "OFX_LINUX_CHECK_BUNDLE is not in build/CMakeCache.txt"; exit 1; }
          # RUNPATH/RPATH entries that don't start with $ORIGIN are problems (openfx #163), except those listed in
          # OFX_ABI_RPATH_ALLOW (exact match): the CMake bundle's only other entry is this build's in-tree SeExpr
          # (installers rewrite the rpath)
          export OFX_ABI_RPATH_ALLOW="$PWD/SeExprBuild/lib"
          echo "OFX_ABI_RPATH_ALLOW=$OFX_ABI_RPATH_ALLOW"
          "$check" -v --no-needed Bundle
      - name: Build (debug, C++20, Makefiles)
        if: env.EXTRA_VARIANTS == 'true'
        run: make -j4 CONFIG=debug SEEXPR_HOME=$PWD/SeExprBuild CXX="g++ -std=c++20"
      - name: Tests
        # tests/Makefile and io-hostdemo (on the installed bundle), run by ctest
        env:
          # io-hostdemo fails if the bundle is not installed or lacks a plug-in
          IO_HOSTDEMO_STRICT: 1
        run: ctest --test-dir build --output-on-failure
      - name: Upload the hostDemo test outputs
        if: failure()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-hostdemo-ubuntu_24
          path: build/hostdemo/out
          if-no-files-found: ignore
      - name: Tests (C++20)
        if: env.EXTRA_VARIANTS == 'true'
        run: make -C tests clean test CXXSTD=-std=c++20 SEEXPR_HOME=$PWD/SeExprBuild
      - name: Generate testing bundle
        run: |
          # Bundle used for Natron's automated testing. It carries the libraries of Ubuntu 24.04, but no system libraries
          # (glibc, libstdc++, libgcc_s, libgomp, GLVND, OpenCL, X11: see find_and_copy_deps.py), so it needs Ubuntu 24.04's.
          # Release bundles are built on Rocky Linux 9 (see "Linux runtime requirements" in README.md).
          cp -r Bundle TestingBundle
          printf '%s\n' "Ubuntu 24.04 testing build, not a release." \
            "openfx-io ${GITHUB_REF_NAME} (${GITHUB_SHA}), built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "It carries no system libraries (glibc, libstdc++, libgcc_s, libgomp, libGL, X11): they come from the system," \
            "and those of Ubuntu 24.04 (glibc 2.39) or later are needed. Release builds target Rocky Linux 9." \
            > TestingBundle/README.txt
          BINARY_PATH=TestingBundle/IO.ofx.bundle/Contents/Linux-x86-64
          python3 .github/workflows/find_and_copy_deps.py --manifest=IO.manifest ${BINARY_PATH}/IO.ofx ${BINARY_PATH} \
            SeExprBuild/lib /usr/lib /usr/lib/x86_64-linux-gnu
          patchelf --force-rpath --set-rpath '$ORIGIN' ${BINARY_PATH}/IO.ofx
          # No system library may be bundled (same limits as the Bundle check above; --no-needed: the copied
          # Ubuntu libraries find their dependencies in the system).
          OFX_ABI_GLIBC=99 OFX_ABI_GLIBCXX=99 OFX_ABI_CXXABI=99 OFX_ABI_GCC=99 OFX_ABI_GOMP=99 OFX_ABI_LIBATOMIC=99 \
            OFX_ABI_ZLIB=99 "$(sed -n 's/^OFX_LINUX_CHECK_BUNDLE:FILEPATH=//p' build/CMakeCache.txt)" -v --no-needed TestingBundle
          # Load check: replace RTLD_LAZY with RTLD_NOW so that missing symbols make loading fail.
          sed -e 's/RTLD_LAZY/RTLD_NOW/g' openfx/HostSupport/src/ofxhBinary.cpp > ofxhBinaryStrict.cpp
          g++ -o verify_plugin_loads .github/workflows/verify_plugin_loads.cpp ofxhBinaryStrict.cpp -I openfx/HostSupport/include/ -I openfx/include/
          ./verify_plugin_loads ${BINARY_PATH}/IO.ofx
      - name: Upload testing artifacts
        if: env.UPLOAD_BUNDLES == 'true'
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-build-ubuntu_24-testing
          path: TestingBundle

  macos:
    name: macOS 15 (Xcode clang, MacPorts)
    # macOS runners are scarce: only build on macOS once Linux and Windows passed (they already skip drafts and
    # unchanged nightlies). macOS is informative: merging only requires Linux and Windows.
    needs: [linux, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 150
    env:
      MACPORTS_VERSION: 2.12.7
      SEEXPR_HOME: /opt/local/libexec/seexpr211
      MACPORTS_PKG_SHA256: 87b2e87ed7adc4aca947b42eb7ff991614cc0edfccb486237f2bbc75f28aae63
      # Compile with the system (Xcode) clang, libraries from MacPorts only.
      CXX: clang++ -std=c++17
      # Natron 2.6 supports macOS 14 and later (also the default of Makefile.master and CMakeLists.txt). MacPorts'
      # libraries are built for the runner's macOS: the bundle's dependencies may require a newer one.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # MacPorts' OpenImageIO links the ffmpeg8 port: link the plugins (FFMPEG_PKG_CONFIG_PATH, full paths, see
      # Makefile.master) and the tests (PKG_CONFIG_PATH) against the same FFmpeg.
      FFMPEG_PKG_CONFIG_PATH: /opt/local/libexec/ffmpeg8/lib/pkgconfig
      PKG_CONFIG_PATH: /opt/local/libexec/ffmpeg8/lib/pkgconfig
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Install MacPorts
        run: |
          curl -fsSL -o MacPorts.pkg "https://github.com/macports/macports-base/releases/download/v${MACPORTS_VERSION}/MacPorts-${MACPORTS_VERSION}-15-Sequoia.pkg"
          echo "${MACPORTS_PKG_SHA256}  MacPorts.pkg" | shasum -a 256 -c -
          sudo installer -pkg MacPorts.pkg -target /
      - name: Install MacPorts packages
        run: |
          # Use only MacPorts tools and libraries: take Homebrew out of PATH.
          export PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          sudo port -N selfupdate
          sudo port -N install pkgconfig cmake bison flex gsed libomp openimageio opencolorio openexr libraw ffmpeg8 libpng expat
          port installed
      - name: Prepare the SeExpr prefix
        # In MacPorts' prefix, so that osxDeploy.sh (which bundles /opt/local libraries) bundles libSeExpr
        run: sudo mkdir -p "$SEEXPR_HOME" && sudo chown "$USER" "$SEEXPR_HOME"
      - name: Cache SeExpr
        id: cache-seexpr
        uses: actions/cache@v4
        with:
          path: ${{ env.SEEXPR_HOME }}
          key: seexpr-2.11-natron-patches-macos-15-arm64-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Build SeExpr 2.11
        if: steps.cache-seexpr.outputs.cache-hit != 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          git clone -q --depth 1 -b v2.11 https://github.com/wdas/SeExpr.git SeExprSrc
          cd SeExprSrc
          # Apply the patches of Natron's MacPorts seexpr211 port, which make SeExpr 2.11 build on arm64:
          # -msse4.1 and the SSE intrinsics are gated behind USE_SSE41 / __SSE4_1__.
          NATRON_PORT=https://raw.githubusercontent.com/NatronGitHub/Natron/84a303b3d7b14f92ab445e71a8c4f24eb9285478/tools/MacPorts/graphics/seexpr211/files
          for p in 0001-seexpr-2.11-fix-cxxflags.patch 0002-seexpr-2.11-fix-inline-error.patch 0004-seexpr-2.11-c++98.patch 0006-seexpr-2.11-cstylecast.patch; do
            curl -fsSL "${NATRON_PORT}/${p}" | patch -p1
          done
          sed -i '' -e "/SeExprEditor/d" -e "/demos/d" -e "/tests/d" -e "/doc/d" CMakeLists.txt
          # Absolute install name (like MacPorts' libraries), so that osxDeploy.sh finds and bundles libSeExpr
          cmake . -B build -DCMAKE_INSTALL_PREFIX=$SEEXPR_HOME -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_CXX_STANDARD=11 -DUSE_SSE41=FALSE \
            -DCMAKE_INSTALL_NAME_DIR=$SEEXPR_HOME/lib \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBISON_EXECUTABLE=/opt/local/bin/bison -DFLEX_EXECUTABLE=/opt/local/bin/flex
          make -j3 -C build
          make install -C build
      - name: Build (release, CMake)
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          # MacPorts' cmake; OFX_DEPLOY_BUNDLES: osxDeploy.sh at install, as the Makefiles do for release builds
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOFX_IO_REQUIRE_ALL=ON -DCMAKE_CXX_COMPILER=/usr/bin/clang++ -DOFX_CXX_STANDARD=17 \
            -DSEEXPR_HOME=$SEEXPR_HOME -DFFMPEG_PKG_CONFIG_PATH="$FFMPEG_PKG_CONFIG_PATH" -DOFX_DEPLOY_BUNDLES=ON \
            -DIO_TESTS_CXX=clang++ -DIO_TESTS_MAKE_ARGS=WITH_LIBRAW=1 -DCMAKE_INSTALL_PREFIX=$PWD -DPLUGIN_INSTALLDIR=Bundle \
            -DIO_HOSTDEMO_TESTS=ON
          cmake --build build -j3
          # installs Bundle/IO.ofx.bundle
          cmake --install build
          otool -L Bundle/IO.ofx.bundle/Contents/MacOS/IO.ofx | grep -v /System/Library
      - name: Build (debug, C++20, Makefiles)
        if: env.EXTRA_VARIANTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          make -j3 CONFIG=debug SEEXPR_HOME=$SEEXPR_HOME CXX="clang++ -std=c++20" FFMPEG_PKG_CONFIG_PATH="$FFMPEG_PKG_CONFIG_PATH"
      - name: Tests
        run: |
          # MacPorts' ffmpeg8 installs suffixed tools (ffmpeg8, ffprobe8): the test scripts call ffmpeg/ffprobe.
          mkdir -p "$RUNNER_TEMP/ffbin"
          ln -sf /opt/local/bin/ffmpeg8 "$RUNNER_TEMP/ffbin/ffmpeg"
          ln -sf /opt/local/bin/ffprobe8 "$RUNNER_TEMP/ffbin/ffprobe"
          export PATH="$RUNNER_TEMP/ffbin":/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          # tests/Makefile (CXX=clang++ WITH_LIBRAW=1) and io-hostdemo (on the installed, deployed bundle), run by ctest
          IO_HOSTDEMO_STRICT=1 ctest --test-dir build --output-on-failure
          if [ "$EXTRA_VARIANTS" = true ]; then
            make -C tests clean test CXX=clang++ WITH_LIBRAW=1 CXXSTD=-std=c++20
          fi
      - name: Upload the hostDemo test outputs
        if: failure()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-hostdemo-macos_15
          path: build/hostdemo/out
          if-no-files-found: ignore
      - name: Verify the plugin loads
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          # The release bundle is self-contained (osxDeploy.sh copies its libraries into Contents/Libraries):
          # load it without any DYLD_* path, so that a library missing from the bundle makes the check fail.
          unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
          # Replace RTLD_LAZY with RTLD_NOW so that missing symbols make loading fail.
          sed -e 's/RTLD_LAZY/RTLD_NOW/g' openfx/HostSupport/src/ofxhBinary.cpp > ofxhBinaryStrict.cpp
          clang++ -std=c++17 -o verify_plugin_loads .github/workflows/verify_plugin_loads.cpp ofxhBinaryStrict.cpp -I openfx/HostSupport/include/ -I openfx/include/
          ./verify_plugin_loads Bundle/IO.ofx.bundle/Contents/MacOS/IO.ofx
          # Loading alone doesn't prove self-containment (the /opt/local paths exist on this runner): the plug-in
          # and its bundled libraries must only reference @rpath/@loader_path libraries and system libraries.
          shopt -s nullglob
          if otool -L Bundle/IO.ofx.bundle/Contents/MacOS/IO.ofx Bundle/IO.ofx.bundle/Contents/Libraries/* | grep -E '^[[:space:]]+/(opt|usr/local)/'; then
            echo "error: the bundle references the libraries above outside of the bundle"; exit 1
          fi
      - name: Upload artifacts
        if: env.UPLOAD_BUNDLES == 'true'
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-build-macos_15-release
          path: Bundle

  windows:
    name: Windows (MSYS2 UCRT64)
    needs: changes
    # no CI for draft pull requests; the scheduled run only if master changed
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.run == 'true') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Install MSYS2 UCRT64 packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git base-devel unzip
          # pacboy's "name:p" is ${MINGW_PACKAGE_PREFIX}-name for the msystem above: no hard-coded environment
          pacboy: >-
            cc:p pkgconf:p python:p cmake:p ninja:p
            openimageio:p opencolorio:p openexr:p libraw:p ffmpeg:p seexpr:p libpng:p fmt:p expat:p
      - name: Build (release, CMake)
        run: |
          set -eo pipefail
          # cmake.exe is a native program: pass Windows paths
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_IO_REQUIRE_ALL=ON -DSEEXPR_HOME="$(cygpath -m "$MINGW_PREFIX")" \
            -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$PWD")" -DPLUGIN_INSTALLDIR=Bundle -DIO_HOSTDEMO_TESTS=ON
          cmake --build build -j4
          # installs Bundle/IO.ofx.bundle
          cmake --install build
      - name: Build (debug, C++20, Makefiles)
        if: env.EXTRA_VARIANTS == 'true'
        run: |
          set -eo pipefail
          make -j4 CONFIG=debug SEEXPR_HOME="$MINGW_PREFIX" CXX="g++ -std=c++20"
      - name: Tests
        # tests/Makefile, run directly: ctest would run MSYS2's make outside of the MSYS2 shell; ctest only loads
        # the CMake-built IO.ofx (io-load), checks its icons (io-icons) and renders every plug-in of the installed
        # bundle with hostDemo (io-hostdemo, a bash script: the bundle's DLLs are found in $MINGW_PREFIX/bin, on PATH)
        run: |
          set -eo pipefail
          make -C tests test
          ctest --test-dir build -R '^io-(load|icons)$' --output-on-failure
          # (--no-tests=error: fails if there is no io-hostdemo test; IO_HOSTDEMO_STRICT: if the bundle is not
          # installed or lacks a plug-in)
          IO_HOSTDEMO_STRICT=1 ctest --test-dir build -R '^io-hostdemo$' --no-tests=error --output-on-failure
      - name: Upload the hostDemo test outputs
        if: failure()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-hostdemo-windows_ucrt64
          path: build/hostdemo/out
          if-no-files-found: ignore
      - name: Tests (C++20)
        if: env.EXTRA_VARIANTS == 'true'
        run: |
          set -eo pipefail
          make -C tests clean test CXXSTD=-std=c++20
      - name: Generate testing bundle
        run: |
          set -eo pipefail
          # Self-contained bundle used for Natron's automated testing.
          cp -r Bundle TestingBundle
          BINARY_PATH=TestingBundle/IO.ofx.bundle/Contents/Win64
          python3 .github/workflows/find_and_copy_deps.py --manifest=IO.manifest ${BINARY_PATH}/IO.ofx ${BINARY_PATH} "$MINGW_PREFIX/bin"
          # Use the newest installed Windows SDK's mt.exe (the SDK version on the runner changes over time).
          MT_EXE=`ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64/mt.exe | sort -V | tail -1`
          "${MT_EXE}" -manifest IO.manifest -outputresource:"${BINARY_PATH}/IO.ofx;2"
          # Load check, with only the bundle and System32 on PATH, so that a DLL missing from the bundle makes it fail
          # (the checker itself is linked statically, so it needs no MSYS2 DLL).
          g++ -static -o verify_plugin_loads .github/workflows/verify_plugin_loads.cpp openfx/HostSupport/src/ofxhBinary.cpp openfx/HostSupport/src/ofxhUtilities.cpp -I openfx/HostSupport/include/ -I openfx/include/
          if ! ( cd ${BINARY_PATH} && PATH=".:/c/Windows/System32" ../../../../verify_plugin_loads ./IO.ofx ); then
            # Diagnostics: load each bundled DLL on its own to find unresolved imports (ERROR_PROC_NOT_FOUND etc.)
            g++ -static -o load_each_dll .github/workflows/load_each_dll.cpp
            ( cd ${BINARY_PATH} && PATH=".:/c/Windows/System32" ../../../../load_each_dll *.dll ./IO.ofx )
            exit 1
          fi
      - name: Upload testing artifacts
        if: env.UPLOAD_BUNDLES == 'true'
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-build-windows_ucrt64-testing
          path: TestingBundle
