name: Continuous Integration

# Per push/PR: exactly three full CMake builds + tests (macOS/MacPorts, Linux, Windows/MSYS2 UCRT64): Release, C++17
# (Natron's Qt5 builds); and the sanitizer tests, on Linux (linux-sanitizers, in parallel with the others). Extra
# variants (Debug builds with C++20, Natron's Qt6 builds, also with CMake, and their tests) only run weekly or on demand.
# Every build, test and dependency build uses CMake (and ctest), openfx-io's only build system. Natron's Linux testing
# bundle (linux-natron: Ubuntu 24.04, with its own FFmpeg build) is built on pushes, weekly and on demand, not for pull
# requests.
#
# Weekly run (Saturdays): the jobs whose upstream moves (linux: Ubuntu 26.04's updates and runner image; windows:
# MSYS2 UCRT64, a rolling distribution; macos: MacPorts, updated by "port selfupdate") run every week, even if master
# didn't change, so that an upstream update that breaks the build is seen within a week. linux-natron (FFmpeg pinned
# and cached, also built on every push to master) only runs if master changed since the last weekly run (the
# "changes" job).
#
# Frugal CI (NatronGitHub runners are shared by all repos): one run per change. The macOS job (scarce runners)
# only runs after the Linux and Windows jobs passed; merging requires only Linux and Windows. Pushes run CI only on
# master, RB-* and tags; feature branches run through their pull request. Draft pull requests don't run CI: drafts are
# validated locally; CI runs once, when the PR is marked ready (ready_for_review). Superseded runs are cancelled,
# except for tags. Artifacts only for tags and manual runs.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * 6' # weekly, Saturdays 03:17 UTC: extra variants (linux-natron skipped if master didn't change)
  push:
    branches: [master, 'RB-*']
    tags: ['*']
    paths-ignore:
      - LICENSE
      - README.md
      - 'Documentation/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - LICENSE
      - README.md
      - 'Documentation/**'

permissions:
  contents: read

concurrency:
  # weekly and manual runs have their own groups, so that they don't cancel (or get cancelled by) master's push CI.
  # Runs of draft pull requests (which skip every job) have their own group too: otherwise a late run of a push made
  # while the PR was a draft cancels the ready_for_review run, then skips itself, and no CI runs at all.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event_name || 'ci' }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Debug builds (C++20, CMake, in build-debug) are an extra variant: only on schedule or on demand.
  EXTRA_VARIANTS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  # Bundles (testing bundles, e.g. those of Natron's CI: see "Natron's testing bundles" in README.md) are only uploaded
  # for tags and manual runs.
  UPLOAD_BUNDLES: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
  # The desktop libraries of Natron's Linux installer (SYSTEM_LIBS_RE in tools/jenkins/build-Linux-installer.sh), which
  # the Linux testing bundles never carry (find_and_copy_deps.py): their linuxCheckBundle.sh check counts the runner's
  # sonames that match it as system libraries (OFX_ABI_SYSTEM_LIBS), so that it fails if one is bundled.
  DESKTOP_LIBS_RE: '^lib(X[A-Za-z0-9]*|X11-xcb|xcb|xcb-.*|SM|ICE|xkbcommon|xkbcommon-x11|asound)\.so\.[0-9]+$'
  # The hostDemo tests (io-hostdemo, tests/hostdemo/*.sh) fail, instead of skipping, if the bundle is not installed
  # or lacks a plug-in, or if oiiotool is missing
  IO_HOSTDEMO_STRICT: 1

  # SeExpr 2.11 is built (by seexpr211_build.sh) with the patches of Natron's SDKs, at this Natron commit, in this
  # order: those of the MacPorts seexpr211 port (tools/MacPorts/graphics/seexpr211/Portfile) on macOS, and the same ones
  # from the Linux SDK (tools/jenkins/include/patches/SeExpr, applied by tools/jenkins/include/scripts/pkg/seexpr211.sh)
  # on Linux. The Linux SDK also applies 0003 (the Windows DLL install destination) and 0005 (no SeExprEditor and
  # demos, which the script's sed removes too), which don't change libSeExpr on Linux. 0008 makes the parser build with
  # flex >= 2.7.8. The SeExpr cache keys contain these two and the script's hash.
  NATRON_SEEXPR_COMMIT: a659e93445b470d409eca37fdfc9fa8c923d80e6
  NATRON_SEEXPR_PATCHES: >-
    0001-seexpr-2.11-fix-cxxflags.patch
    0002-seexpr-2.11-fix-inline-error.patch
    0004-seexpr-2.11-c++98.patch
    0006-seexpr-2.11-cstylecast.patch
    0007-seexpr-2.11-float-to-unsigned-cast.patch
    0008-seexpr-2.11-flex-buffer-state.patch

jobs:
  # Skip linux-natron in the weekly run if master didn't change since the last completed weekly run (this job only
  # runs on schedule): once per commit, even if that run failed. Only runs that succeeded or failed count: a cancelled
  # (or skipped, timed out...) run didn't build its commit, which the next weekly run builds. Compare commits rather
  # than dates: commit dates may be older than the push. If the API call (or this job) fails, or no such run exists,
  # run anyway. master_changed is only read by linux-natron,
  # whose upstream doesn't move; linux, windows and macos run every week.
  changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      master_changed: ${{ steps.check.outputs.master_changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule --status completed --limit 20 \
            --json headSha,conclusion --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].headSha // empty') || last=
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "master_changed=false" >> "$GITHUB_OUTPUT"
            echo "master ($GITHUB_SHA) didn't change since the last weekly run: skipping linux-natron."
          else
            echo "master_changed=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux (Ubuntu 26.04)
    # No CI for draft pull requests. Ubuntu 26.04 moves (apt-get update installs its updates of FFmpeg, OpenImageIO,
    # OpenColorIO, LibRaw..., and the runner image changes weekly): the weekly run builds on Linux every week, even if
    # master didn't change (no "needs: changes").
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    # Ubuntu 26.04: its FFmpeg is 8.0.1 (the minimum, see README.md), and its OpenImageIO links the same FFmpeg
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      # pkg-config directory of the FFmpeg to build against; empty: Ubuntu's (libavcodec-dev, ...: FFmpeg 8.0.1)
      FFMPEG_PKG_CONFIG_PATH: ""
      # OIIOText's default font (OpenImageIO's FreeMono, from fonts-freefont-ttf): OpenImageIO 2.5 only looks for fonts
      # in its font directories (e.g. /usr/share/fonts) and the directories just below them, not deeper as 2.4 did,
      # so not in /usr/share/fonts/truetype/freefont (enumerate_fonts(),
      # https://github.com/AcademySoftwareFoundation/OpenImageIO/blob/v2.5.19.1/src/libOpenImageIO/imagebufalgo_draw.cpp#L790-L846)
      OPENIMAGEIO_FONTS: /usr/share/fonts/truetype/freefont
      # seexpr211_build.sh's extra CMake arguments (part of the SeExpr cache key): none
      SEEXPR_CMAKE_ARGS: ""
      # test-ffmpeg (tests/run_ffmpeg_read_test.sh) fails on a skipped section (#198), except this one: the FFV1 encoder
      # of Ubuntu's FFmpeg 8.0.1 writes bgr0 instead of Bayer
      FFMPEG_READ_TEST_STRICT: 1
      FFMPEG_READ_TEST_EXPECTED_SKIPS: '^ffv1 wrote .*, not bayer_rggb16le$'
      # linuxCheckBundle.sh's symbol version limits: this build uses Ubuntu's libraries, so none (99). A Rocky Linux 9
      # build would use the defaults (EL9's limits).
      OFX_ABI_GLIBC: 99
      OFX_ABI_GLIBCXX: 99
      OFX_ABI_CXXABI: 99
      OFX_ABI_GCC: 99
      OFX_ABI_GOMP: 99
      OFX_ABI_LIBATOMIC: 99
      OFX_ABI_ZLIB: 99
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Install Ubuntu system packages
        run: |
          sudo apt-get update
          # fonts-freefont-ttf: FreeMono, one of the default fonts of OpenImageIO (DroidSans, cour, Courier New, FreeMono),
          # for OIIOText (io-hostdemo); python3-dev, nanobind and NumPy: openfx's ofxh module, the host of io-hostdemo
          sudo apt-get install -y cmake bison flex libopencolorio-dev libopenimageio-dev openimageio-tools libfmt-dev libopenexr-dev libimath-dev \
            libgl-dev libegl-dev liblcms2-dev libraw-dev libwebp-dev libtiff-dev libopenjp2-7-dev libpng-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev ffmpeg patchelf libexpat1-dev fonts-freefont-ttf \
            python3-dev python3-nanobind nanobind-dev python3-numpy
      - name: Configure a source archive (no .git, no submodules)
        # Like GitHub's source tarballs, git archive has no .git and empty submodule directories: the configure must
        # stop and say how to get the submodules without git (#224), not "git submodule update", which needs .git.
        run: |
          src="$RUNNER_TEMP/io-archive"
          log="$RUNNER_TEMP/io-archive.log"
          mkdir "$src"
          git archive HEAD | tar -x -C "$src"
          if cmake -S "$src" -B "$RUNNER_TEMP/io-archive-build" > "$log" 2>&1; then
            cat "$log"
            echo "::error::configuring a source archive without its submodules succeeded"
            exit 1
          fi
          cat "$log"
          if ! grep -q 'git clone --recursive' "$log"; then
            echo "::error::the error message doesn't say to use git clone --recursive"
            exit 1
          fi
          if grep -q 'git submodule update' "$log"; then
            echo "::error::the error message says to run git submodule update, which needs .git"
            exit 1
          fi
      - name: Cache SeExpr
        id: cache-seexpr
        uses: actions/cache@v4
        with:
          path: SeExprBuild
          key: seexpr-2.11-ubuntu-26.04-LinuxSDK-${{ hashFiles('.github/workflows/seexpr211_build.sh') }}-${{ env.NATRON_SEEXPR_COMMIT }}-${{ env.NATRON_SEEXPR_PATCHES }}-${{ env.SEEXPR_CMAKE_ARGS }}
      - name: Build SeExpr 2.11
        if: steps.cache-seexpr.outputs.cache-hit != 'true'
        run: |
          # with the patches of Natron's Linux SDK (see NATRON_SEEXPR_PATCHES)
          # shellcheck disable=SC2086 # SEEXPR_CMAKE_ARGS: a space-separated list
          .github/workflows/seexpr211_build.sh "$GITHUB_WORKSPACE/SeExprBuild" LinuxSDK $SEEXPR_CMAKE_ARGS
      - name: Build (release, C++17, CMake)
        run: |
          # IO_HOSTDEMO_TESTS: ctest renders every plug-in of the installed bundle with openfx's Python host, with
          # hostDemo's command line (io-hostdemo), with Ubuntu's Python
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DOFX_IO_REQUIRE_ALL=ON -DSEEXPR_HOME=$PWD/SeExprBuild \
            -DFFMPEG_PKG_CONFIG_PATH="$FFMPEG_PKG_CONFIG_PATH" -DCMAKE_INSTALL_PREFIX=$PWD -DPLUGIN_INSTALLDIR=Bundle -DIO_HOSTDEMO_TESTS=ON \
            -DPython_EXECUTABLE=/usr/bin/python3
          cmake --build build -j4
          # installs Bundle/IO.ofx.bundle
          cmake --install build
      - name: Check the installed bundle (linuxCheckBundle.sh)
        # openfx's linuxCheckBundle.sh (OFX_LINUX_CHECK_BUNDLE): no bundled system library, no GLIBC_PRIVATE, GLIBC_ABI_*,
        # DT_RELR or unnumbered version need, only $ORIGIN rpaths (or OFX_ABI_RPATH_ALLOW's). This build uses
        # Ubuntu 26.04's libraries (glibc 2.43, GCC 15): --no-needed (they come from the system, nothing is bundled)
        # and no symbol version limit (the job's OFX_ABI_*).
        # Exit status 1 (problems) or 2 (usage error, missing tool) fails the job.
        run: |
          check=$(sed -n 's/^OFX_LINUX_CHECK_BUNDLE:FILEPATH=//p' build/CMakeCache.txt)
          test -n "$check" || { echo "OFX_LINUX_CHECK_BUNDLE is not in build/CMakeCache.txt"; exit 1; }
          # RUNPATH/RPATH entries that don't start with $ORIGIN are problems (openfx #163), except those listed in
          # OFX_ABI_RPATH_ALLOW (exact match): the CMake bundle's only other entry is this build's in-tree SeExpr
          # (installers rewrite the rpath)
          export OFX_ABI_RPATH_ALLOW="$PWD/SeExprBuild/lib"
          echo "OFX_ABI_RPATH_ALLOW=$OFX_ABI_RPATH_ALLOW"
          "$check" -v --no-needed Bundle
      - name: Build (debug, C++20, CMake)
        if: env.EXTRA_VARIANTS == 'true'
        run: |
          cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug -DOFX_CXX_STANDARD=20 -DOFX_IO_REQUIRE_ALL=ON -DSEEXPR_HOME=$PWD/SeExprBuild \
            -DFFMPEG_PKG_CONFIG_PATH="$FFMPEG_PKG_CONFIG_PATH" -DCMAKE_INSTALL_PREFIX=$PWD/build-debug-install -DPLUGIN_INSTALLDIR=Bundle
          cmake --build build-debug -j4
          # installs build-debug-install/Bundle/IO.ofx.bundle, for io-load-installed (#309)
          cmake --install build-debug
      - name: Tests
        # the tests of tests/ (tests/CMakeLists.txt), io-load, io-icons, and io-hostdemo (on the installed bundle), run
        # by ctest
        run: ctest --test-dir build --output-on-failure
      - name: Upload the hostDemo test outputs
        if: failure()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-hostdemo-ubuntu_26
          path: |
            build/hostdemo/out
            build/hostdemo-ofx14/out
          if-no-files-found: ignore
      - name: Tests (debug, C++20)
        # the same, built with C++20 (the bundle of the Debug build: io-load, io-icons, io-load-installed; no
        # io-hostdemo)
        if: env.EXTRA_VARIANTS == 'true'
        run: ctest --test-dir build-debug --output-on-failure
      - name: Skips inside the tests
        # ctest --output-on-failure hides the output of the passing tests: list what they skipped (#309)
        if: ${{ !cancelled() }}
        run: bash tests/ctest_skips.sh build build-debug
      - name: Generate testing bundle
        run: |
          # A self-contained bundle for testing on Ubuntu 26.04 (Natron's CI uses linux-natron's, for Ubuntu 24.04). It
          # carries the libraries of Ubuntu 26.04 (including the OpenCL ICD loader libOpenCL.so.1, which libavutil
          # needs, #270), but no system libraries (glibc, the GCC runtime, GLVND, libdrm, libselinux, libudev, X11: see
          # find_and_copy_deps.py and "Linux runtime requirements" in README.md), so it needs Ubuntu 26.04's. Release
          # bundles are built on Rocky Linux 9.
          cp -r Bundle TestingBundle
          printf '%s\n' "Ubuntu 26.04 testing build, not a release." \
            "openfx-io ${GITHUB_REF_NAME} (${GITHUB_SHA}), built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "It carries Ubuntu's libraries (including the OpenCL ICD loader, libOpenCL.so.1), but no system libraries:" \
            "glibc, libstdc++, libgcc_s, libgomp, libatomic, libGL (GLVND), libdrm, libselinux, libudev and the desktop" \
            "libraries (libX11, libxcb...) come from the system, and those of Ubuntu 26.04 (glibc 2.43) or later are" \
            "needed. Ubuntu packages:" "$(.github/workflows/check_testing_bundle.sh --packages)" \
            "The licences of the bundled libraries are in IO.ofx.bundle/Contents/Resources/Licenses: the Debian" \
            "copyright file of each package, and the licences they refer to in common-licenses (LIBRARIES.txt: the" \
            "package of each library). Release builds target Rocky Linux 9." \
            > TestingBundle/README.txt
          BINARY_PATH=TestingBundle/IO.ofx.bundle/Contents/Linux-x86-64
          # Its libraries (from SeExprBuild and Ubuntu) and their licences, checked (see the script)
          bash .github/workflows/make_linux_testing_bundle.sh ${BINARY_PATH} SeExprBuild/lib /usr/lib /usr/lib/x86_64-linux-gnu
          # Load check (io_verify_plugin_loads: RTLD_NOW, so that missing symbols make loading fail)
          build/io_verify_plugin_loads ${BINARY_PATH}/IO.ofx
      - name: Check the testing bundle on a clean Ubuntu 26.04 (docker)
        # The runner has more libraries than a user's system (e.g. the OpenCL ICD loader, a build dependency, #270):
        # check that the bundle needs no undocumented system library, and load IO.ofx (RTLD_NOW) in a clean ubuntu:26.04
        # container, with only the documented runtime packages and their dependencies.
        run: .github/workflows/check_testing_bundle.sh TestingBundle/IO.ofx.bundle ubuntu:26.04 build/io_verify_plugin_loads
      - name: Upload testing artifacts
        if: env.UPLOAD_BUNDLES == 'true'
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-build-ubuntu_26-testing
          path: TestingBundle
          # 90 days: the repository's default and maximum, pinned so that a lower default doesn't shorten it (Natron's
          # testing assets are made from these bundles)
          retention-days: 90

  linux-sanitizers:
    # The sanitizer variants of the tests (IO_TESTS_SANITIZERS: ThreadSanitizer, AddressSanitizer and UBSan builds of
    # the test programs, e.g. the race tests of #319 and #250), which no other job runs (#399). A job of its own, run
    # when the "linux" job runs and in parallel with it, so that the required jobs don't wait for it, and nothing waits
    # for it (macos needs linux and windows only). It builds the plug-ins and the tests (without SeExpr, which no
    # sanitizer test uses: no SeExpr build) and runs only the sanitizer tests (not all of them: see below). Ubuntu
    # runners are not the scarce ones (macOS and Windows are).
    name: Linux sanitizers (Ubuntu 26.04)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # OIIOText's default font (see the "linux" job)
      OPENIMAGEIO_FONTS: /usr/share/fonts/truetype/freefont
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Install Ubuntu system packages
        run: |
          sudo apt-get update
          # ffmpeg: test-readffmpeg-views-concurrent-tsan makes its clip with the ffmpeg CLI; openimageio-tools: the
          # imported targets of OpenImageIO's CMake package (OpenImageIO::iconvert...) need its programs;
          # fonts-freefont-ttf: OIIOText's default font (test-ofx14-scan-asan renders it), as in the "linux" job
          sudo apt-get install -y cmake libopencolorio-dev libopenimageio-dev openimageio-tools libfmt-dev libopenexr-dev libimath-dev \
            libgl-dev libegl-dev liblcms2-dev libraw-dev libpng-dev libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libexpat1-dev ffmpeg fonts-freefont-ttf
      - name: Build (C++17, CMake, IO_TESTS_SANITIZERS)
        run: |
          # OFX_IO_REQUIRE_ALL: a missing library fails here, instead of silently dropping its sanitizer tests
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DOFX_IO_REQUIRE_ALL=ON -DOFX_IO_WITH_SEEXPR=OFF \
            -DIO_TESTS_SANITIZERS=ON
          cmake --build build -j4
      - name: Sanitizer tests
        run: |
          # ThreadSanitizer's shadow memory needs at most 28 bits of mmap randomization: the runners' kernels may use
          # more (vm.mmap_rnd_bits=32), and the TSan programs then fail at start ("unexpected memory mapping")
          sudo sysctl -w vm.mmap_rnd_bits=28
          # the tests that IO_TESTS_SANITIZERS adds, named *-tsan, *-asan, *-ubsan, *-tsan-debug, *-asan-full...
          # (tests/CMakeLists.txt); no match fails. ([-], not -: ctest takes a value that starts with - for an option)
          # Not in CI (#471): the ThreadSanitizer tests whose OpenColorIO or OpenEXR calls give false races with
          # Ubuntu's uninstrumented libraries (their own synchronisation is invisible to TSan), which tests/tsan.supp
          # can't suppress without "unlock of an unlocked mutex" reports (see there): test-ocio-processor-cache-tsan (its
          # purges during renders; test-ocio-processor-cache-renders-tsan runs the rest) and the exr-*-tsan tests. They
          # stay registered and run locally (e.g. macOS, where TSan ignores uninstrumented libraries). Runs here: the ASan
          # and UBSan tests, and 6 TSan tests (10 tests).
          ctest --test-dir build --output-on-failure --no-tests=error -R '[-](a|t|ub)san([-]|$)' \
            -E '^test-(ocio-processor-cache-tsan|exr-tsan|exr-multiplanar-tsan|exr-tsan-debug)$'

  linux-natron:
    # Natron's Linux testing bundle. Natron's CI (RB-2.6 .github/workflows/ci.yml) runs its Linux tests on
    # ubuntu-24.04 (there is no pyside2 on 26.04), with the openfx-io-build-ubuntu_24-testing.zip asset of the
    # natron_testing release (see "Natron's testing bundles" in README.md): the bundle must load on Ubuntu 24.04,
    # whose FFmpeg is older than the plug-ins' minimum (8.0.1). This job builds FFmpeg (cached, like SeExpr) and
    # IO.ofx against it on ubuntu-24.04, bundles that FFmpeg (and Ubuntu's other libraries), and checks that the bundle
    # loads (verify_plugin_loads) and renders (hostDemo) without LD_LIBRARY_PATH. The rest of the CI (tests, weekly
    # variants) is the "linux" job's, on 26.04.
    # Not per pull request (which stays at three builds: Linux 26.04, Windows, macOS): on pushes to master, RB-* and
    # tags (so that a merge that breaks the bundle Natron uses is seen at once), weekly if master changed, and on
    # demand (the runs whose artifact replaces the natron_testing asset).
    name: Linux testing bundle for Natron (Ubuntu 24.04, FFmpeg 9.0.2)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.master_changed == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # The FFmpeg of the bundle: the FFmpeg 9.0 of Natron's SDKs (macOS: MacPorts' 9.0.2). FFMPEG_CONFIGURE: its
      # configure options (also in the cache key: changing them rebuilds it). A shared GPL build without the
      # programs and without autodetected libraries (they would be bundled too), with FFmpeg's own codecs and
      # libx264, libx265 and libvpx, as WriteFFmpeg and ReadFFmpeg offer with Ubuntu's FFmpeg.
      FFMPEG_VERSION: n9.0.2
      FFMPEG_CONFIGURE: --enable-shared --disable-static --disable-programs --disable-doc --disable-autodetect --enable-gpl --enable-zlib --enable-libx264 --enable-libx265 --enable-libvpx
      # seexpr211_build.sh's extra CMake arguments (part of the SeExpr cache key): none
      SEEXPR_CMAKE_ARGS: ""
      # linuxCheckBundle.sh's symbol version limits: this build uses Ubuntu's libraries, so none (99). A Rocky Linux 9
      # build would use the defaults (EL9's limits).
      OFX_ABI_GLIBC: 99
      OFX_ABI_GLIBCXX: 99
      OFX_ABI_CXXABI: 99
      OFX_ABI_GCC: 99
      OFX_ABI_GOMP: 99
      OFX_ABI_LIBATOMIC: 99
      OFX_ABI_ZLIB: 99
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Install Ubuntu system packages
        run: |
          sudo apt-get update
          # no libav*-dev (Ubuntu 24.04's FFmpeg 6.1 is too old): nasm, zlib1g-dev, libx264-dev, libx265-dev and
          # libvpx-dev build FFmpeg; openimageio-tools (oiiotool) and fonts-freefont-ttf for hostDemo
          sudo apt-get install -y cmake bison flex nasm zlib1g-dev libx264-dev libx265-dev libvpx-dev \
            libopencolorio-dev libopenimageio-dev openimageio-tools libfmt-dev libopenexr-dev libimath-dev \
            libgl-dev libegl-dev liblcms2-dev libraw-dev libwebp-dev libtiff-dev libopenjp2-7-dev libpng-dev \
            patchelf libexpat1-dev fonts-freefont-ttf
      - name: Cache FFmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: FFmpegBuild
          # v2: the v1 entries have FFmpegSrc/../FFmpegBuild in their .pc files, which doesn't resolve on a cache hit;
          # v3: FFmpeg's licences in FFmpegBuild/share/licenses/FFmpeg
          key: ffmpeg-v3-${{ env.FFMPEG_VERSION }}-ubuntu-24.04-${{ env.FFMPEG_CONFIGURE }}
      - name: Build FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 -b "$FFMPEG_VERSION" https://github.com/FFmpeg/FFmpeg.git FFmpegSrc
          cd FFmpegSrc
          # an absolute prefix without "..": it is written into the .pc files, and on a cache hit FFmpegSrc doesn't
          # exist, so FFmpegSrc/../FFmpegBuild wouldn't resolve
          # shellcheck disable=SC2086
          ./configure --prefix="$GITHUB_WORKSPACE/FFmpegBuild" $FFMPEG_CONFIGURE
          make -j4
          make install
          # its licences, for the testing bundle (copy_bundled_licenses.sh)
          mkdir -p "$GITHUB_WORKSPACE/FFmpegBuild/share/licenses/FFmpeg"
          cp LICENSE.md COPYING.* "$GITHUB_WORKSPACE/FFmpegBuild/share/licenses/FFmpeg/"
      - name: Cache SeExpr
        id: cache-seexpr
        uses: actions/cache@v4
        with:
          path: SeExprBuild
          key: seexpr-2.11-ubuntu-24.04-LinuxSDK-${{ hashFiles('.github/workflows/seexpr211_build.sh') }}-${{ env.NATRON_SEEXPR_COMMIT }}-${{ env.NATRON_SEEXPR_PATCHES }}-${{ env.SEEXPR_CMAKE_ARGS }}
      - name: Build SeExpr 2.11
        if: steps.cache-seexpr.outputs.cache-hit != 'true'
        run: |
          # with the patches of Natron's Linux SDK (see NATRON_SEEXPR_PATCHES)
          # shellcheck disable=SC2086 # SEEXPR_CMAKE_ARGS: a space-separated list
          .github/workflows/seexpr211_build.sh "$GITHUB_WORKSPACE/SeExprBuild" LinuxSDK $SEEXPR_CMAKE_ARGS
      - name: Build (release, C++17, CMake)
        run: |
          # BUILD_EXAMPLE_HOSTS: openfx's C++ hostDemo (not built by default: openfx is EXCLUDE_FROM_ALL), and
          # io_verify_plugin_loads, for the checks below (only the load checks of ctest are run: the other tests,
          # including io-hostdemo, on openfx's Python host, are the "linux" job's)
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DOFX_IO_REQUIRE_ALL=ON -DSEEXPR_HOME=$PWD/SeExprBuild \
            -DFFMPEG_PKG_CONFIG_PATH="$PWD/FFmpegBuild/lib/pkgconfig" -DCMAKE_INSTALL_PREFIX=$PWD -DPLUGIN_INSTALLDIR=Bundle \
            -DBUILD_EXAMPLE_HOSTS=ON
          cmake --build build -j4
          cmake --build build -j4 --target hostDemo
          # installs Bundle/IO.ofx.bundle
          cmake --install build
      - name: Load the build-tree and installed IO.ofx (ctest io-load, io-icons, io-load-installed)
        # Without LD_LIBRARY_PATH: the DT_RPATH of IO.ofx must have the in-tree FFmpegBuild/lib and SeExprBuild/lib,
        # for IO.ofx and FFmpeg's own dependencies (#273)
        run: |
          n=0
          for f in $(find build Bundle -path '*/Contents/Linux-x86-64/IO.ofx' -type f); do
            n=$((n + 1))
            readelf -d "$f" | grep -E 'R(UN)?PATH'
            readelf -d "$f" | grep -q '(RPATH).*FFmpegBuild/lib' || { echo "$f: no DT_RPATH with FFmpegBuild/lib"; exit 1; }
          done
          [ "$n" -ge 2 ] || { echo "found $n IO.ofx, expected the build-tree and installed ones"; exit 1; }
          unset LD_LIBRARY_PATH
          ctest --test-dir build --output-on-failure -R '^io-(load|icons|load-installed)$'
      - name: Generate testing bundle
        run: |
          # The libraries of Ubuntu 24.04 (including the OpenCL ICD loader libOpenCL.so.1, which Ubuntu's libavutil.so.58
          # needs, #270) and FFmpeg 9.0.2 (FFmpegBuild, which ldd finds through IO.ofx's DT_RPATH, #273), but no system
          # libraries (see find_and_copy_deps.py). Ubuntu's
          # OpenImageIO links Ubuntu's FFmpeg 6.1 (libavcodec.so.60), which is bundled too: the plug-ins' FFmpeg has
          # other sonames (libavcodec.so.63) and versioned symbols, so that both load in the same process.
          cp -r Bundle TestingBundle
          printf '%s\n' "Ubuntu 24.04 testing build (FFmpeg ${FFMPEG_VERSION#n}), not a release." \
            "openfx-io ${GITHUB_REF_NAME} (${GITHUB_SHA}), built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "It carries FFmpeg and Ubuntu's libraries (including the OpenCL ICD loader, libOpenCL.so.1), but no system libraries:" \
            "glibc, libstdc++, libgcc_s, libgomp, libatomic, libGL (GLVND), libdrm, libselinux, libudev and the desktop" \
            "libraries (libX11, libxcb...) come from the system, and those of Ubuntu 24.04 (glibc 2.39) or later are" \
            "needed. Ubuntu packages:" "$(.github/workflows/check_testing_bundle.sh --packages)" \
            "The licences of the bundled libraries are in IO.ofx.bundle/Contents/Resources/Licenses: the Debian" \
            "copyright file of each package, and the licences they refer to in common-licenses (LIBRARIES.txt: the" \
            "package of each library). Release builds target Rocky Linux 9." \
            > TestingBundle/README.txt
          BINARY_PATH=TestingBundle/IO.ofx.bundle/Contents/Linux-x86-64
          # Its libraries (from FFmpegBuild, SeExprBuild and Ubuntu) and their licences, checked (see the script)
          bash .github/workflows/make_linux_testing_bundle.sh ${BINARY_PATH} FFmpegBuild/lib SeExprBuild/lib /usr/lib \
            /usr/lib/x86_64-linux-gnu
          for l in avformat avcodec avutil swscale; do
            ls ${BINARY_PATH}/lib${l}.so.* > /dev/null || { echo "lib${l} is not in the bundle"; exit 1; }
          done
          ls ${BINARY_PATH}
      - name: Check the testing bundle (verify_plugin_loads, hostDemo)
        env:
          OCIO: ${{ github.workspace }}/tests/test.ocio
        run: |
          # Without LD_LIBRARY_PATH: the bundle must find its FFmpeg by itself. ldd shows which FFmpeg each library
          # gets.
          unset LD_LIBRARY_PATH
          BINARY_PATH=TestingBundle/IO.ofx.bundle/Contents/Linux-x86-64
          ldd ${BINARY_PATH}/IO.ofx | grep -E 'libav|libsw|OpenImageIO'
          hd=$(find build -type f -name hostDemo -perm -u+x | head -1)
          vp=$(find build -type f -name io_verify_plugin_loads -perm -u+x | head -1)
          test -n "$hd" && test -n "$vp"
          # Load check (io_verify_plugin_loads: RTLD_NOW, so that missing symbols make loading fail)
          "$vp" ${BINARY_PATH}/IO.ofx
          # hostDemo renders every plug-in of the testing bundle (tests/hostdemo/run.sh, as io-hostdemo), including
          # ReadOIIO (Ubuntu's FFmpeg 6.1, through OpenImageIO) and Read/WriteFFmpeg (FFmpeg 9.0.2) in one process
          bash tests/hostdemo/run.sh "$hd" TestingBundle/IO.ofx.bundle "$vp" "$PWD/hostdemo-testing"
      - name: Check the testing bundle on a clean Ubuntu 24.04 (docker)
        # The runner has more libraries than a user's system (e.g. the OpenCL ICD loader, a build dependency, #270):
        # check that the bundle needs no undocumented system library, and load IO.ofx (RTLD_NOW) in a clean ubuntu:24.04
        # container, with only the documented runtime packages and their dependencies.
        run: .github/workflows/check_testing_bundle.sh TestingBundle/IO.ofx.bundle ubuntu:24.04 build/io_verify_plugin_loads
      - name: Upload the hostDemo test outputs
        if: failure()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-hostdemo-ubuntu_24-testing
          path: hostdemo-testing/out
          if-no-files-found: ignore
      - name: Upload testing artifacts
        if: env.UPLOAD_BUNDLES == 'true'
        uses: actions/upload-artifact@v4.3.1
        with:
          # the name of the natron_testing asset that Natron's CI downloads
          name: openfx-io-build-ubuntu_24-testing
          path: TestingBundle
          # 90 days: the repository's default and maximum, pinned so that a lower default doesn't shorten it (Natron's
          # testing assets are made from these bundles)
          retention-days: 90

  macos:
    name: macOS 15 (Xcode clang, MacPorts)
    # macOS runners are scarce: only build on macOS once Linux and Windows passed (they already skip drafts). macOS is
    # informative: merging only requires Linux and Windows. MacPorts moves (port selfupdate): like Linux and Windows,
    # the weekly run builds on macOS every week, even if master didn't change.
    needs: [linux, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.windows.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 150
    env:
      MACPORTS_VERSION: 2.12.7
      SEEXPR_HOME: /opt/local/libexec/seexpr211
      # seexpr211_build.sh's extra CMake arguments (part of the SeExpr cache key): the system (Xcode) clang, as for the
      # plug-ins; no SSE4.1 (arm64)
      SEEXPR_CMAKE_ARGS: -DUSE_SSE41=FALSE -DCMAKE_CXX_COMPILER=/usr/bin/clang++
      MACPORTS_PKG_SHA256: 87b2e87ed7adc4aca947b42eb7ff991614cc0edfccb486237f2bbc75f28aae63
      # The FFmpeg to build against (FFMPEG_PKG_CONFIG_PATH: CMake links it by full paths, plug-ins and tests): the
      # ffmpeg8 port, which MacPorts' OpenImageIO may link. FFMPEG_BIN_SUFFIX: the suffix of its tools (ffmpeg8,
      # ffprobe8), which the tests call as ffmpeg and ffprobe.
      FFMPEG_PKG_CONFIG_PATH: /opt/local/libexec/ffmpeg8/lib/pkgconfig
      FFMPEG_BIN_SUFFIX: "8"
      # test-ffmpeg (tests/run_ffmpeg_read_test.sh) fails on a skipped section (#198), except these, which depend on
      # the options and version of MacPorts' ffmpeg8 (hap: libsnappy; FFV1 Bayer: bgr0, as Ubuntu's FFmpeg 8.0.1) or
      # on the runner (VideoToolbox's HEVC encoder, which a virtual machine may not have). Not yet seen in a run: to
      # be narrowed from the first ones.
      FFMPEG_READ_TEST_STRICT: 1
      FFMPEG_READ_TEST_EXPECTED_SKIPS: '^(no hap encoder|ffv1 wrote .*, not bayer_rggb16le$|no hevc_videotoolbox encoder|the ffmpeg CLI could not encode .* with hevc_videotoolbox:|hevc_videotoolbox wrote )'
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Install MacPorts
        run: |
          curl -fsSL -o MacPorts.pkg "https://github.com/macports/macports-base/releases/download/v${MACPORTS_VERSION}/MacPorts-${MACPORTS_VERSION}-15-Sequoia.pkg"
          echo "${MACPORTS_PKG_SHA256}  MacPorts.pkg" | shasum -a 256 -c -
          sudo installer -pkg MacPorts.pkg -target /
      - name: Install MacPorts packages
        run: |
          # Use only MacPorts tools and libraries: take Homebrew out of PATH.
          export PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          sudo port -N selfupdate
          # python311, py311-nanobind, py311-numpy: openfx's ofxh module, the host of io-hostdemo
          sudo port -N install pkgconfig cmake bison flex gsed libomp openimageio opencolorio openexr libraw ffmpeg8 libpng expat \
            python311 py311-nanobind py311-numpy
          port installed
      - name: Target the runner's macOS
        # CI bundles aren't shipped: target the runner's macOS (e.g. 15.0 on macos-15), for the later steps (SeExpr,
        # CMake, the load check). Release bundles target macOS 14.0 (the default of CMakeLists.txt)
        # and are built on macOS 14. Trade-off: CI no longer catches uses of APIs newer than macOS 14;
        # only the release builds on macOS 14 do.
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"
      - name: Prepare the SeExpr prefix
        # In MacPorts' prefix, so that osxDeploy.sh (which bundles /opt/local libraries) bundles libSeExpr
        run: sudo mkdir -p "$SEEXPR_HOME" && sudo chown "$USER" "$SEEXPR_HOME"
      - name: Cache SeExpr
        id: cache-seexpr
        uses: actions/cache@v4
        with:
          path: ${{ env.SEEXPR_HOME }}
          key: seexpr-2.11-macos-15-arm64-${{ env.MACOSX_DEPLOYMENT_TARGET }}-MacPorts-${{ hashFiles('.github/workflows/seexpr211_build.sh') }}-${{ env.NATRON_SEEXPR_COMMIT }}-${{ env.NATRON_SEEXPR_PATCHES }}-${{ env.SEEXPR_CMAKE_ARGS }}
      - name: Build SeExpr 2.11
        if: steps.cache-seexpr.outputs.cache-hit != 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          # with the patches of Natron's MacPorts seexpr211 port (see NATRON_SEEXPR_PATCHES), which make SeExpr 2.11
          # build on arm64 (-msse4.1 and the SSE intrinsics are gated behind USE_SSE41 / __SSE4_1__) and with
          # MacPorts' flex (>= 2.7.8)
          # shellcheck disable=SC2086 # SEEXPR_CMAKE_ARGS: a space-separated list
          .github/workflows/seexpr211_build.sh "$SEEXPR_HOME" MacPorts $SEEXPR_CMAKE_ARGS
      - name: Build (release, C++17, CMake)
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          # MacPorts' cmake, the system (Xcode) clang; OFX_DEPLOY_BUNDLES: osxDeploy.sh at install, as for release
          # builds. The tests that link ReadOIIO build its RAW support, as the bundle (IO_TESTS_WITH_LIBRAW).
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOFX_IO_REQUIRE_ALL=ON -DCMAKE_CXX_COMPILER=/usr/bin/clang++ -DOFX_CXX_STANDARD=17 \
            -DSEEXPR_HOME=$SEEXPR_HOME -DFFMPEG_PKG_CONFIG_PATH="$FFMPEG_PKG_CONFIG_PATH" -DOFX_DEPLOY_BUNDLES=ON \
            -DCMAKE_INSTALL_PREFIX=$PWD -DPLUGIN_INSTALLDIR=Bundle -DIO_HOSTDEMO_TESTS=ON -DPython_EXECUTABLE=/opt/local/bin/python3.11
          cmake --build build -j3
          # installs Bundle/IO.ofx.bundle
          cmake --install build
          otool -L Bundle/IO.ofx.bundle/Contents/MacOS/IO.ofx | grep -v /System/Library
      - name: Build (debug, C++20, CMake)
        if: env.EXTRA_VARIANTS == 'true'
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug -DOFX_IO_REQUIRE_ALL=ON -DCMAKE_CXX_COMPILER=/usr/bin/clang++ -DOFX_CXX_STANDARD=20 \
            -DSEEXPR_HOME=$SEEXPR_HOME -DFFMPEG_PKG_CONFIG_PATH="$FFMPEG_PKG_CONFIG_PATH"
          cmake --build build-debug -j3
      - name: FFmpeg tools for the tests
        run: |
          # the test scripts call ffmpeg and ffprobe: MacPorts' ffmpeg8 installs them with a suffix (ffmpeg8, ffprobe8)
          mkdir -p "$RUNNER_TEMP/ffbin"
          ln -sf "/opt/local/bin/ffmpeg${FFMPEG_BIN_SUFFIX}" "$RUNNER_TEMP/ffbin/ffmpeg"
          ln -sf "/opt/local/bin/ffprobe${FFMPEG_BIN_SUFFIX}" "$RUNNER_TEMP/ffbin/ffprobe"
      - name: Tests
        run: |
          export PATH="$RUNNER_TEMP/ffbin":/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          # the tests of tests/ (tests/CMakeLists.txt), io-load, io-icons, io-load-installed and io-hostdemo (on the
          # installed, deployed bundle), run by ctest
          ctest --test-dir build --output-on-failure
      - name: Upload the hostDemo test outputs
        if: failure()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-hostdemo-macos_15
          path: |
            build/hostdemo/out
            build/hostdemo-ofx14/out
          if-no-files-found: ignore
      - name: Tests (debug, C++20)
        # the same, built with C++20 (the bundle of the Debug build: io-load, io-icons; no io-hostdemo)
        if: env.EXTRA_VARIANTS == 'true'
        run: |
          export PATH="$RUNNER_TEMP/ffbin":/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          ctest --test-dir build-debug --output-on-failure
      - name: Skips inside the tests
        # ctest --output-on-failure hides the output of the passing tests: list what they skipped (#309)
        if: ${{ !cancelled() }}
        run: bash tests/ctest_skips.sh build build-debug
      - name: Verify the plugin loads
        run: |
          export PATH=/opt/local/bin:/opt/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
          # The release bundle is self-contained (osxDeploy.sh copies its libraries into Contents/Libraries):
          # load it without any DYLD_* path, so that a library missing from the bundle makes the check fail.
          unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
          # io_verify_plugin_loads: RTLD_NOW, so that missing symbols make loading fail
          build/io_verify_plugin_loads Bundle/IO.ofx.bundle/Contents/MacOS/IO.ofx
          # Loading alone doesn't prove self-containment (the /opt/local paths exist on this runner): the plug-in
          # and its bundled libraries must only reference @rpath/@loader_path libraries and system libraries.
          shopt -s nullglob
          if otool -L Bundle/IO.ofx.bundle/Contents/MacOS/IO.ofx Bundle/IO.ofx.bundle/Contents/Libraries/* | grep -E '^[[:space:]]+/(opt|usr/local)/'; then
            echo "error: the bundle references the libraries above outside of the bundle"; exit 1
          fi
      - name: Upload artifacts
        if: env.UPLOAD_BUNDLES == 'true'
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-build-macos_15-release
          path: Bundle
          # 90 days: the repository's default and maximum, pinned so that a lower default doesn't shorten it (Natron
          # doesn't use the macOS bundle, see README "Natron's testing bundles")
          retention-days: 90

  windows:
    name: Windows (MSYS2 UCRT64)
    # No CI for draft pull requests. MSYS2 is a rolling distribution (e.g. its FFmpeg moves): the weekly run builds on
    # Windows every week, even if master didn't change (no "needs: changes").
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # pkg-config directory of the FFmpeg to build against (an MSYS2 path); empty: MSYS2's (ffmpeg:p)
      FFMPEG_PKG_CONFIG_PATH: ""
      # test-ffmpeg (tests/run_ffmpeg_read_test.sh) fails on a skipped section (#198), except this one: MSYS2's FFmpeg
      # has no hap encoder (no libsnappy)
      FFMPEG_READ_TEST_STRICT: 1
      FFMPEG_READ_TEST_EXPECTED_SKIPS: '^no hap encoder'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Install MSYS2 UCRT64 packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          # (perl: tests/run_ffmpeg_read_test.sh edits clips with it, and fails without it in CI)
          install: >-
            git base-devel unzip perl
          # pacboy's "name:p" is ${MINGW_PACKAGE_PREFIX}-name for the msystem above: no hard-coded environment
          # (gdb: tests/hostdemo/hang.sh dumps the stacks of a hung hostDemo or reader_window, #244; python, nanobind,
          # python-numpy: openfx's ofxh module, the host of io-hostdemo)
          pacboy: >-
            cc:p pkgconf:p python:p python-numpy:p nanobind:p cmake:p ninja:p
            openimageio:p opencolorio:p openexr:p libraw:p ffmpeg:p seexpr:p libpng:p fmt:p expat:p
            gdb:p
      - name: Build (release, C++17, CMake)
        run: |
          # cmake.exe is a native program: pass Windows paths
          ffpc=; [ -z "$FFMPEG_PKG_CONFIG_PATH" ] || ffpc="$(cygpath -m "$FFMPEG_PKG_CONFIG_PATH")"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOFX_CXX_STANDARD=17 -DOFX_IO_REQUIRE_ALL=ON \
            -DSEEXPR_HOME="$(cygpath -m "$MINGW_PREFIX")" -DFFMPEG_PKG_CONFIG_PATH="$ffpc" \
            -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$PWD")" -DPLUGIN_INSTALLDIR=Bundle -DIO_HOSTDEMO_TESTS=ON \
            -DPython_EXECUTABLE="$(cygpath -m "$MINGW_PREFIX/bin/python.exe")"
          cmake --build build -j4
          # installs Bundle/IO.ofx.bundle
          cmake --install build
      - name: Build (debug, C++20, CMake)
        if: env.EXTRA_VARIANTS == 'true'
        run: |
          ffpc=; [ -z "$FFMPEG_PKG_CONFIG_PATH" ] || ffpc="$(cygpath -m "$FFMPEG_PKG_CONFIG_PATH")"
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOFX_CXX_STANDARD=20 -DOFX_IO_REQUIRE_ALL=ON \
            -DSEEXPR_HOME="$(cygpath -m "$MINGW_PREFIX")" -DFFMPEG_PKG_CONFIG_PATH="$ffpc"
          cmake --build build-debug -j4
      - name: Tests
        # the tests of tests/ (tests/CMakeLists.txt; test-ffmpeg and test-oiio are bash scripts, which call MSYS2's
        # ffmpeg and oiiotool), io-load, io-icons, and io-hostdemo (on the installed bundle; a bash script), run by
        # ctest. The DLLs are found in $MINGW_PREFIX/bin, on PATH.
        run: |
          ctest --test-dir build --output-on-failure
      - name: Upload the hostDemo test outputs
        if: failure()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-hostdemo-windows_ucrt64
          path: |
            build/hostdemo/out
            build/hostdemo-ofx14/out
          if-no-files-found: ignore
      - name: Tests (debug, C++20)
        # the same, built with C++20 (the bundle of the Debug build: io-load, io-icons; no io-hostdemo)
        if: env.EXTRA_VARIANTS == 'true'
        run: |
          ctest --test-dir build-debug --output-on-failure
      - name: Skips inside the tests
        # ctest --output-on-failure hides the output of the passing tests: list what they skipped (#309)
        if: ${{ !cancelled() }}
        run: bash tests/ctest_skips.sh build build-debug
      - name: Generate testing bundle
        run: |
          # Self-contained bundle used for Natron's automated testing (the natron_testing asset
          # openfx-io-build-windows_ucrt64-testing.zip, see "Natron's testing bundles" in README.md).
          cp -r Bundle TestingBundle
          printf '%s\n' "Windows (MSYS2 UCRT64) testing build, not a release." \
            "openfx-io ${GITHUB_REF_NAME} (${GITHUB_SHA}), built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "The licences of the bundled DLLs are in IO.ofx.bundle/Contents/Resources/Licenses: the licence files and" \
            "the pacman information (PACKAGE-INFO.txt) of each MSYS2 package, and in spdx, the licence texts of the" \
            "packages that have no licence file (LIBRARIES.txt: the package of each DLL)." \
            > TestingBundle/README.txt
          BINARY_PATH=TestingBundle/IO.ofx.bundle/Contents/Win64
          python3 .github/workflows/find_and_copy_deps.py --manifest=IO.manifest --json=bundle-deps.json \
            ${BINARY_PATH}/IO.ofx ${BINARY_PATH} "$MINGW_PREFIX/bin"
          # The licences of the bundled DLLs (their MSYS2 packages' share/licenses files and pacman -Qi, and SPDX's
          # texts for the packages that have no licence file), in Contents/Resources/Licenses
          bash .github/workflows/copy_bundled_licenses.sh bundle-deps.json ${BINARY_PATH} \
            TestingBundle/IO.ofx.bundle/Contents/Resources/Licenses
          # Use the newest installed Windows SDK's mt.exe (the SDK version on the runner changes over time).
          MT_EXE=`ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64/mt.exe | sort -V | tail -1`
          "${MT_EXE}" -manifest IO.manifest -outputresource:"${BINARY_PATH}/IO.ofx;2"
          # Load check, with only the bundle and System32 on PATH, so that a DLL missing from the bundle makes it fail
          # (the checker itself is linked statically, so it needs no MSYS2 DLL).
          g++ -static -o verify_plugin_loads tests/verify_plugin_loads.cpp openfx/HostSupport/src/ofxhBinary.cpp openfx/HostSupport/src/ofxhUtilities.cpp -I openfx/HostSupport/include/ -I openfx/include/
          if ! ( cd ${BINARY_PATH} && PATH=".:/c/Windows/System32" ../../../../verify_plugin_loads ./IO.ofx ); then
            # Diagnostics: load each bundled DLL on its own to find unresolved imports (ERROR_PROC_NOT_FOUND etc.)
            g++ -static -o load_each_dll .github/workflows/load_each_dll.cpp
            ( cd ${BINARY_PATH} && PATH=".:/c/Windows/System32" ../../../../load_each_dll *.dll ./IO.ofx )
            exit 1
          fi
          # Every bundled DLL comes with its licence (#272)
          bash .github/workflows/check_bundled_licenses.sh ${BINARY_PATH} \
            TestingBundle/IO.ofx.bundle/Contents/Resources/Licenses
      - name: Upload testing artifacts
        if: env.UPLOAD_BUNDLES == 'true'
        uses: actions/upload-artifact@v4.3.1
        with:
          name: openfx-io-build-windows_ucrt64-testing
          path: TestingBundle
          # 90 days: the repository's default and maximum, pinned so that a lower default doesn't shorten it (Natron's
          # testing assets are made from these bundles)
          retention-days: 90
